/* =====================================================================
   Singende Landkarte – Gestaltung „Foto“ (DESIGN-foto.md, SEITE-landkarte.md Abschnitt 6)
   Umbau 26.09.2026: Farben und Schrift des Vereins, Punkte nach Art (nicht nach Land),
   Karte auf dem Handy zuerst, keine Google-Dienste, OpenStreetMap statt CARTO.
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --anthra:#393434;   /* Schrift, Linien */
  --deep:#2F4A14;     /* Tiefgrün: gewählte Filter, Singleiter:innen */
  --leaf:#96B839;     /* Logo-Grün: Singkreise (nur als Fläche/Symbol) */
  --leafink:#4D6B1F;  /* Blattgrün-Schrift: kleine Überschriften */
  --gold:#EFB110;     /* Logo-Gelb: Hauptknopf, Einrichtungen */
  --linen:#F5F3E8;    /* Leinen: Hintergrund */
  --sage:#DDE6C9;     /* Salbei: Trennlinien, Hinweise */
  --white:#FFFFFF;
  --grey:#6B6464;     /* Nebeninfos */
  --sans:"PT Sans","Trebuchet MS",system-ui,sans-serif;
}
body{font-family:var(--sans);font-size:17px;line-height:1.45;background:var(--white);color:var(--anthra);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Kopf: schlicht, weiß – die Überschrift steht auf der Wix-Seite */
#header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--sage);flex-shrink:0}
#brand{display:flex;flex-direction:column;gap:1px}
#header h1{font-size:20px;font-weight:400;letter-spacing:-.01em;line-height:1.15}
#header .sub{font-size:15px;color:var(--grey)}
#header .count{font-size:15px;color:var(--grey);white-space:nowrap}
#header-count{margin-left:auto;font-weight:700;color:var(--anthra)}

#main{display:flex;flex:1;overflow:hidden}

/* Filterspalte links */
/* Die ganze Spalte scrollt (Filter und Liste zusammen), der Druckknopf bleibt unten stehen */
#sidebar{width:360px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--sage);overflow-y:auto;background:var(--white)}
#controls{padding:14px 18px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--sage)}
.lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--leafink);margin-bottom:6px}

/* Filter-Pillen (Art und Land) */
#tabs,#land-btns{display:flex;flex-wrap:wrap;gap:6px}
.tab,.land-btn{font-size:14px;font-weight:700;line-height:1.2;color:var(--anthra);background:var(--linen);border:1px solid var(--anthra);border-radius:9999px;padding:5px 11px;cursor:pointer;user-select:none;white-space:nowrap}
.tab:hover,.land-btn:hover{text-decoration:underline;text-underline-offset:3px}
.tab.active,.land-btn.active-all,.land-btn.active-de,.land-btn.active-at,.land-btn.active-ch{background:var(--deep);border-color:var(--deep);color:var(--white)}

/* Suchfelder */
#search,#plz-input,#km-select,.select{width:100%;font-size:17px;background:var(--white);border:1px solid var(--anthra);border-radius:12px;padding:8px 12px;outline:none}
#search::placeholder,#plz-input::placeholder{color:var(--grey)}
#umkreis-toggle{display:none} /* Umkreissuche ist immer offen (einfacher für wenig geübte Nutzer:innen) */
#umkreis-box{display:flex;flex-direction:column;gap:8px}
#umkreis-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
#km-select{padding:8px 6px;cursor:pointer}
#umkreis-btns{display:flex;gap:14px;align-items:center}
#btn-umkreis-suche{background:var(--gold);color:var(--anthra);border:0;border-radius:9999px;padding:9px 20px;font-weight:700;cursor:pointer}
#btn-umkreis-suche:disabled{opacity:.6;cursor:wait}
#btn-umkreis-reset{background:none;border:0;font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
#umkreis-status{font-size:15px}
#umkreis-status:empty{display:none}
#umkreis-status.ok{color:var(--deep);font-weight:700}
#umkreis-status.err{color:#8B2020;font-weight:700}
.umkreis-circle path{stroke:var(--deep);fill:var(--deep);fill-opacity:.06;stroke-width:2;stroke-dasharray:6,4}

.row{display:flex;flex-direction:column}
.label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--leafink);margin-bottom:6px}
.select{cursor:pointer}
#bl-wrap,#typ2-wrap{display:none}
#bl-wrap.visible,#typ2-wrap.visible{display:flex}

#err{display:none;margin:12px 18px;padding:10px 14px;background:#FBEAEA;border-radius:12px;color:#8B2020;font-size:15px}

/* Liste */
#list-count{font-size:15px;font-weight:700;padding:12px 18px 4px}
#list{flex:1 0 auto;padding:0 18px 8px}
.list-item{padding:10px 0;border-bottom:1px solid var(--sage);cursor:pointer}
.list-item:hover .item-name{text-decoration:underline;text-underline-offset:3px}
.list-item.active{background:var(--linen);box-shadow:-18px 0 0 var(--linen),18px 0 0 var(--linen)}
.item-top{display:flex;flex-direction:column;gap:4px}
.item-name{font-size:17px;font-weight:700;line-height:1.25}
.item-location{font-size:15px;color:var(--grey);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-sub{font-size:15px;color:var(--grey);overflow-wrap:anywhere}
.item-sub a{color:var(--anthra);font-weight:700;text-decoration:none}
.no-results{padding:18px 0;color:var(--grey);font-size:16px}

/* Etiketten nach Art (Farbe wie der Punkt auf der Karte) */
.badge{align-self:flex-start;font-size:13px;font-weight:700;border-radius:9999px;padding:1px 10px;white-space:nowrap}
.badge.singleiter{background:var(--deep);color:var(--white)}
.badge.singkreis{background:var(--leaf);color:var(--anthra)}
.badge.einrichtung{background:var(--gold);color:var(--anthra)}
.badge.online{background:var(--sage);color:var(--anthra)}
.land-badge{font-size:13px;font-weight:700;border:1px solid var(--grey);border-radius:9999px;padding:0 8px;color:var(--grey)}

/* PDF / Drucken: gelbe Pille */
#dl-box{position:sticky;bottom:0;background:var(--white);padding:12px 18px 14px;border-top:1px solid var(--sage)}
#btn-pdf{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--anthra);border:0;border-radius:9999px;padding:11px 22px;font-weight:700;font-size:16px;cursor:pointer}
#dl-box p{font-size:14px;color:var(--grey);margin-top:6px}

/* Karte */
#map{flex:1;z-index:1;background:#EEF0E4}
.leaflet-container{font-family:var(--sans)}
/* Hintergrund leicht aufhellen, damit die Punkte wirken; Ersatzkarte OpenStreetMap zusätzlich entsättigen */
.leaflet-tile-pane{filter:brightness(1.05)}
#map.karte-osm .leaflet-tile-pane{filter:grayscale(.55) brightness(1.04) contrast(.95)}
.leaflet-control-attribution{font-size:12px}
.leaflet-bar a{color:var(--anthra)}

/* Legende unten links in der Karte */
.lk-legende{background:var(--white);border:1px solid var(--sage);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.3;display:flex;flex-direction:column;gap:4px}
.lk-legende span{display:flex;align-items:center;gap:8px}
.lk-legende i{width:14px;height:14px;border-radius:9999px;border:2px solid var(--white);outline:1px solid var(--sage);display:inline-block}

#loading{position:absolute;inset:0;background:rgba(245,243,232,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px}
#loading.hidden{display:none}
.spinner{width:38px;height:38px;border:3px solid var(--sage);border-top-color:var(--deep);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:17px;color:var(--grey)}

/* Eintrags-Kasten (Klick auf einen Punkt) – ohne Schatten, mit feinem Rand */
.leaflet-popup-content-wrapper{background:var(--white);border-radius:14px;box-shadow:0 0 0 1px var(--sage);padding:0}
.leaflet-popup-tip{background:var(--white);box-shadow:none}
.leaflet-popup-content{margin:0;min-width:220px;max-width:300px;font-size:16px;line-height:1.4}
.popup-inner{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.popup-title{font-size:18px;font-weight:700;line-height:1.25;color:var(--anthra);display:flex;flex-direction:column;gap:4px}
.popup-meta{font-size:15px;color:var(--grey)}
.popup-note{font-size:15px;color:var(--grey)}
.popup-contacts{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.leaflet-container a.popup-link,.popup-link{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--anthra);text-decoration:none;overflow-wrap:anywhere}
.popup-link:hover span{text-decoration:underline;text-underline-offset:3px}
.popup-link svg{flex:0 0 14px}
.popup-header-fav{width:40px;height:40px;border-radius:8px;object-fit:contain;background:var(--white);border:1px solid var(--sage)}

/* Punkte: schlicht, Farbe nach Art, weißer Rand (wie die Vorschau) */
.punkt-wrap{background:none;border:0}
.punkt{border-radius:50%;border:2px solid #FFFFFF;box-sizing:border-box;transition:transform .15s;cursor:pointer}
.punkt.singleiter{background:#2F4A14}
.punkt.singkreis{background:#96B839}
.punkt.einrichtung{background:#EFB110}
.punkt:hover{transform:scale(1.25)}
.punkt.active-marker{transform:scale(1.45);outline:2px solid #393434;outline-offset:1px}

/* Jahrestagung: türkiser Punkt mit Schild (Tagungsfarbe „Flow“; Weiß auf #137F7D = 4,9 : 1) */
.jt-marke{position:relative;width:0;height:0}
.jt-punkt{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#137F7D;border:3px solid #FFFFFF;box-sizing:border-box;cursor:pointer}
.jt-schild{position:absolute;left:14px;top:-13px;white-space:nowrap;background:#137F7D;color:#FFFFFF;font-weight:700;font-size:13px;line-height:1;padding:6px 10px;border-radius:9999px;border:2px solid #FFFFFF;cursor:pointer}
.badge.jt{background:#137F7D;color:#FFFFFF}

/* Handy: Karte zuerst, darunter Filter und Liste */
@media (max-width:780px){
  body{height:auto;overflow:auto}
  #header{padding:10px 14px;gap:4px 12px}
  #header .sub{display:none}
  #header h1{font-size:18px}
  #main{flex-direction:column;overflow:visible}
  #map{order:-1;flex:none;height:62vh;min-height:320px}
  #sidebar{width:100%;border-right:0;border-top:1px solid var(--sage);overflow:visible}
  #controls{padding:14px}
  #list{padding:0 14px 8px}
  #dl-box{position:static}
  #list-count{padding:12px 14px 4px}
  #dl-box{padding:12px 14px 16px}
}
</style>
</head>

<body>
<div id="loading"><div class="spinner"></div><p>Karte wird geladen …</p></div>

<div id="header">
  <div id="brand">
    <h1>Singende Landkarte</h1>
    <div class="sub">Singleiter:innen, Singkreise und Einrichtungen – auf einen Blick</div>
  </div>
  <span class="count" id="header-count"></span>
  <span class="count" id="header-date"></span>
</div>

<div id="main">
  <div id="sidebar">
    <div id="controls">

      <div>
        <p class="lbl" id="lbl-art">Was suchst du?</p>
        <div id="tabs" role="group" aria-labelledby="lbl-art">
          <button type="button" class="tab active" data-tab="alle" aria-pressed="true">Alle</button>
          <button type="button" class="tab" data-tab="Singleiter" data-cls="singleiter" aria-pressed="false">Singleiter:innen</button>
          <button type="button" class="tab" data-tab="Singkreis" data-cls="singkreis" aria-pressed="false">Singkreise</button>
          <button type="button" class="tab" data-tab="Einrichtung" data-cls="einrichtung" aria-pressed="false">Einrichtungen</button>
          <button type="button" class="tab" data-tab="Online" data-cls="online" aria-pressed="false">Online</button>
        </div>
      </div>

      <div>
        <label class="lbl" for="search" style="display:block">Name oder Ort</label>
        <input type="text" id="search" placeholder="z. B. Musterstadt" autocomplete="off">
      </div>

      <!-- Umkreissuche (immer offen; der Knopf bleibt nur für das Programm erhalten) -->
      <button id="umkreis-toggle" type="button" aria-expanded="true">Umkreissuche</button>
      <div id="umkreis-box" class="open" role="region" aria-labelledby="lbl-plz">
        <label class="lbl" id="lbl-plz" for="plz-input" style="display:block;margin-bottom:0">In der Nähe von</label>
        <div id="umkreis-row">
          <input type="text" id="plz-input" placeholder="Postleitzahl" inputmode="numeric" maxlength="10" autocomplete="postal-code">
          <select id="km-select" aria-label="Umkreis">
            <option value="25">25 km</option>
            <option value="50" selected>50 km</option>
            <option value="75">75 km</option>
            <option value="100">100 km</option>
            <option value="150">150 km</option>
            <option value="200">200 km</option>
          </select>
        </div>
        <div id="umkreis-btns">
          <button id="btn-umkreis-suche" type="button">Suchen</button>
          <button id="btn-umkreis-reset" type="button">Zurücksetzen</button>
        </div>
        <div id="umkreis-status" aria-live="polite"></div>
      </div>

      <div>
        <p class="lbl" id="lbl-land">Land</p>
        <div id="land-btns" role="group" aria-labelledby="lbl-land">
          <button type="button" class="land-btn active-all" data-land="alle" aria-pressed="true">Alle</button>
          <button type="button" class="land-btn" data-land="Deutschland" data-cls="active-de" aria-pressed="false">Deutschland</button>
          <button type="button" class="land-btn" data-land="Österreich" data-cls="active-at" aria-pressed="false">Österreich</button>
          <button type="button" class="land-btn" data-land="Schweiz" data-cls="active-ch" aria-pressed="false">Schweiz</button>
        </div>
      </div>

      <div class="row" id="bl-wrap">
        <label class="label" for="bl-select">Region</label>
        <select class="select" id="bl-select"><option value="alle">Alle</option></select>
      </div>

      <div class="row" id="typ2-wrap">
        <label class="label" for="typ2-select">Art der Einrichtung</label>
        <select class="select" id="typ2-select">
          <option value="alle">Alle</option>
          <option value="Krankenhaus">Krankenhaus</option>
          <option value="Pflegeeinrichtung">Pflegeeinrichtung</option>
          <option value="Gesundheitseinrichtung">Gesundheitseinrichtung</option>

    </div>

    <div id="err"></div>
    <div id="list-count" aria-live="polite"></div>
    <div id="list"></div>

    <div id="dl-box">
      <button id="btn-pdf" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        PDF / Drucken

      <p>Deine aktuelle Auswahl als Liste – zum Ausdrucken oder Speichern.</p>
    </div>
  </div>

  <div id="map" aria-label="Karte"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ------------------------------------------------------------
// Einstellungen (Umbau 26.09.2026) – hier ein- und ausschalten
// ------------------------------------------------------------
// logosAnzeigen: Logo der Webseite im Eintrags-Kasten. AUS, weil die Logos beim Besuch über den Google-Dienst
//   „s2/favicons“ geladen werden – dabei geht die IP-Adresse jeder Besucherin an Google (ohne Einwilligung).
//   Nur auf true stellen, wenn der Vorstand das entschieden hat und es in der Datenschutzerklärung steht.
// berufAnzeigen: Beruf von Singleiter:innen anzeigen. AUS, weil der Zertifikatsantrag nur Name, PLZ, Ort, E-Mail,
//   Telefon und Webseite zur Veröffentlichung abdeckt (SEITE-landkarte.md, Abschnitt 7).
var EINSTELLUNGEN = { logosAnzeigen:false, berufAnzeigen:false };

// Jahrestagung: eigener türkiser Punkt mit Schild (Farbe des Tagungsmotivs „Flow“). Jedes Jahr hier anpassen;
// anzeigen:false blendet ihn aus. Koordinaten = Tagungsort (kein Personeneintrag, wird nicht mitgezählt).
var JAHRESTAGUNG = {
  anzeigen: true,
  titel: "Jahrestagung 2027",
  thema: "Flow – ins Fließen kommen",
  datum: "16.–18. April 2027",
  ort: "Parkhotel Hagenbeck, Hamburg",
  lat: 53.5946, lng: 9.9425,
  link: "https://www.singende-krankenhaeuser.de/jahrestagung2027"
};

// ------------------------------------------------------------
// Dateneinbettung (wird vom VBA-Makro ersetzt)
// ------------------------------------------------------------
var EMBEDDED_DATA = [];

// ------------------------------------------------------------
// Hilfen
// ------------------------------------------------------------
const LAND_CLS = {"Deutschland":"de","Österreich":"at","Schweiz":"ch"};
const TYPE_CLS = {"Singleiter":"singleiter","Singkreis":"singkreis","Einrichtung":"einrichtung"};

function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):"";}

function normUrl(u){
  if(!u) return "";
  u = String(u).trim();
  u = u.replace(/^https?:\/\/https?:\/\//i,"https://");
  u = u.replace(/\s+/g,"");
  if(u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}
function websiteEntries(raw){
  if(!raw) return [];
  return String(raw)
    .split(";")
    .map(x => x.trim())
    .filter(Boolean)
    .map((entry, index) => {
      let label = index === 0 ? "Website" : "Weitere Website";
      let url = entry;
      const m = entry.match(/^([^:]+):\s*(https?:\/\/.+)$/i);
      if(m){
        label = m[1].trim();
        url = m[2].trim();
      }
      return {label, url: normUrl(url)};
    })
    .filter(x => x.url);
}
function firstWebsiteUrl(raw){
  const entries = websiteEntries(raw);
  return entries.length ? entries[0].url : "";
}
function hostFromUrl(u){
  try{ return new URL(normUrl(u)).hostname || ""; }catch(e){ return ""; }
}
function faviconFromUrl(u){
  const h = hostFromUrl(u);
  if(!h) return "";
  return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(h) + "&sz=128";
}
function displayName(d){
  if(d.name) return d.name;
  const combo = ((d.vorname||"") + " " + (d.nachname||"")).trim();
  return combo || "(ohne Name)";
}
function landBadgeClass(land){
  return "land-" + (LAND_CLS[land] || "de");
}

// ------------------------------------------------------------
// Icons: Singleiter = Sänger-Figur, Singkreis = Note, Einrichtung = Kreuz
// Farben nach ART (Umbau 26.09.2026, vorher nach Land): Tiefgrün / Logo-Grün / Logo-Gelb.
// Das Land steht als Etikett in Liste und Kasten.
// ------------------------------------------------------------
const COLORS = {singleiter:"#2F4A14", singkreis:"#96B839", einrichtung:"#EFB110"};
const INK    = {singleiter:"#FFFFFF", singkreis:"#2F4A14", einrichtung:"#393434"}; // Symbolfarbe, gut lesbar auf der Fläche

function svgSinger(color,ink){
  ink=ink||"white";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">'
    +'<circle cx="20" cy="20" r="19" fill="'+color+'" stroke="white" stroke-width="2"/>'
    +'<circle cx="15" cy="13" r="4" fill="'+ink+'"/>'
    +'<ellipse cx="15" cy="15" rx="1.5" ry="1.1" fill="'+color+'"/>'
    +'<rect x="10" y="18" width="9" height="9" rx="2.5" fill="'+ink+'"/>'
    +'<line x1="10" y1="20" x2="6" y2="17" stroke="'+ink+'" stroke-width="2" stroke-linecap="round"/>'
    +'<line x1="19" y1="20" x2="22" y2="17" stroke="'+ink+'" stroke-width="2" stroke-linecap="round"/>'
    +'<path d="M24 14 Q27 17 24 20" stroke="'+ink+'" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
    +'<path d="M26 11 Q31 17 26 23" stroke="'+ink+'" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>'
    +'</svg>';
}
function svgNote(color,ink){
  ink=ink||"white";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">'
    +'<circle cx="20" cy="20" r="19" fill="'+color+'" stroke="white" stroke-width="2"/>'
    +'<path d="M22 11v15.5a4.5 4.5 0 1 1-2-3.8V14l10-2v11.8a4.5 4.5 0 1 1-2-3.8V9.5L22 11z" fill="'+ink+'" opacity="0.95"/>'
    +'</svg>';
}
function svgCross(color,ink){
  ink=ink||"white";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">'
    +'<circle cx="20" cy="20" r="19" fill="'+color+'" stroke="white" stroke-width="2"/>'
    +'<path d="M18 11h4v7h7v4h-7v7h-4v-7h-7v-4h7v-7z" fill="'+ink+'"/>'
    +'</svg>';
}

const ICONS = {
  singleiter: svgSinger(COLORS.singleiter, INK.singleiter),
  singkreis:  svgNote(COLORS.singkreis, INK.singkreis),
  einrichtung:svgCross(COLORS.einrichtung, INK.einrichtung)
};

function makeIcon(d, active){
  // Schlichte Punkte ohne Symbol (Wunsch Tom 26.09.2026: „nicht so verspielt“), Farbe nach Art.
  // Liegen mehrere Einträge auf derselben Koordinate, bekommt jeder einen kleinen Versatz (d._dx/_dy in Pixeln),
  // damit alle sichtbar und anklickbar sind. Der Versatz bleibt bei jedem Zoom gleich.
  const tcls = TYPE_CLS[d.typ] || "singleiter";
  const size = 18, half = size/2;
  const dx = d._dx||0, dy = d._dy||0;
  return L.divIcon({
    className:"punkt-wrap",
    html:`<div class="punkt ${tcls}${active?" active-marker":""}" style="width:${size}px;height:${size}px"></div>`,
    iconSize:[size,size], iconAnchor:[half-dx,half-dy], popupAnchor:[dx,dy-half-2]
  });
}

// ------------------------------------------------------------
// Map + State
// ------------------------------------------------------------
const map = L.map("map",{center:[48.8,10.5],zoom:5});
// Kartenhintergrund (Umbau 26.09.2026):
// 1. Wahl: TopPlusOpen „grau“ des Bundesamts für Kartographie und Geodäsie (BKG) – kostenlos, ohne Schlüssel,
//    Server in Deutschland, Lizenz dl-de/by-2-0 (Namensnennung unten rechts).
//    CARTO verlangt seit 2026 einen API-Schlüssel („API KEY REQUIRED“); die freien OpenStreetMap-Server sperren
//    Aufrufe ohne Herkunftsangabe („Access blocked“, z. B. beim Öffnen der Datei direkt vom Computer).
// 2. Wahl (automatisch, nur wenn die BKG-Kacheln nicht laden): OpenStreetMap.
const KARTE_BKG = L.tileLayer("https://sgx.geodatenzentrum.de/wmts_topplus_open/tile/1.0.0/web_grau/default/WEBMERCATOR/{z}/{y}/{x}.png",{
  attribution:'&copy; <a href="https://www.bkg.bund.de" target="_blank" rel="noopener">Bundesamt für Kartographie und Geodäsie</a> (2026), <a href="https://sg.geodatenzentrum.de/web_public/Datenquellen_TopPlus_Open.pdf" target="_blank" rel="noopener">Datenquellen</a>',
  maxZoom:18
});
const KARTE_OSM = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende',
  maxZoom:19, referrerPolicy:"strict-origin-when-cross-origin"
});
let kartenFehler = 0;
KARTE_BKG.on("tileerror",function(){
  kartenFehler++;
  if(kartenFehler===4 && map.hasLayer(KARTE_BKG)){
    map.removeLayer(KARTE_BKG);
    document.getElementById("map").classList.add("karte-osm");
    KARTE_OSM.addTo(map);
  }
});
KARTE_BKG.addTo(map);
// Legende unten links
(function(){
  const Leg=L.Control.extend({options:{position:"bottomleft"},onAdd:function(){
    const d=L.DomUtil.create("div","lk-legende");
    d.innerHTML='<span><i style="background:#2F4A14"></i>Singleiter:innen</span><span><i style="background:#96B839"></i>Singkreise</span><span><i style="background:#EFB110"></i>Einrichtungen</span>'+(JAHRESTAGUNG.anzeigen?'<span><i style="background:#137F7D"></i>'+esc(JAHRESTAGUNG.titel)+'</span>':'');
    return d;}});
  map.addControl(new Leg());
})();
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener("resize",()=>map.invalidateSize());

let DATA = [], markers = [];
let filteredIdx = [];
let activeItemIndex = null;
let activeTab = "alle";
let activeLand = "alle";
let activeBL = "alle";
let activeEinrTyp = "alle";
let BL_BY_LAND = {};

// Umkreissuche State
let umkreisCenter = null;
let umkreisKm = null;
let umkreisCircle = null;

const el = id => document.getElementById(id);

function showError(msg){ el("err").style.display="block"; el("err").textContent=msg; }
function hideError(){ el("err").style.display="none"; el("err").textContent=""; }
function setHeaderCount(total){ el("header-count").textContent=`${total} Einträge`; }
function setPressed(sel,btn){ Array.from(document.querySelectorAll(sel)).forEach(x=>x.setAttribute("aria-pressed", x===btn?"true":"false")); }

// ------------------------------------------------------------
// Umkreissuche — Geocoding via Nominatim
// ------------------------------------------------------------
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function setUmkreisStatus(msg, cls){
  const s=el("umkreis-status");
  s.textContent=msg;
  s.className=cls||"";
}

function clearUmkreisCircle(){
  if(umkreisCircle){ map.removeLayer(umkreisCircle); umkreisCircle=null; }
}

function resetUmkreis(){
  umkreisCenter=null;
  umkreisKm=null;
  clearUmkreisCircle();
  setUmkreisStatus("");
  el("plz-input").value="";
  applyFilter();
  zoomAufTreffer(false);
}

async function geocodePLZ(plz){
  const url=`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(plz)}&countrycodes=de,at,ch&format=json&limit=1`;
  const resp=await fetch(url,{headers:{"Accept-Language":"de","User-Agent":"SKH-Netzwerkkarte/1.0"}});
  if(!resp.ok) throw new Error("Netzwerkfehler");
  const data=await resp.json();
  if(!data||data.length===0) throw new Error("PLZ nicht gefunden");
  return {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon)};
}

el("umkreis-toggle").addEventListener("click",function(){
  const box=el("umkreis-box");
  const open=box.classList.toggle("open");
  this.classList.toggle("open",open);
  this.setAttribute("aria-expanded",open?"true":"false");
});

el("btn-umkreis-suche").addEventListener("click",async function(){
  const plz=el("plz-input").value.trim();
  if(!plz){ setUmkreisStatus("Bitte PLZ eingeben.","err"); return; }
  const km=parseInt(el("km-select").value,10);
  setUmkreisStatus("Suche läuft…","");
  this.disabled=true;
  try{
    const geo=await geocodePLZ(plz);
    umkreisCenter={lat:geo.lat, lng:geo.lng};
    umkreisKm=km;
    clearUmkreisCircle();
    umkreisCircle=L.circle([geo.lat,geo.lng],{
      radius:km*1000,
      className:"umkreis-circle",
      interactive:false
    }).addTo(map);
    map.fitBounds(umkreisCircle.getBounds(),{padding:[20,20]});
    setUmkreisStatus(`✓ ${km} km um PLZ ${plz}`,"ok");
    applyFilter();
  }catch(e){
    setUmkreisStatus("PLZ nicht gefunden. Bitte prüfen.","err");
    umkreisCenter=null; umkreisKm=null;
    clearUmkreisCircle();
    applyFilter();
  }finally{
    this.disabled=false;
  }
});

el("btn-umkreis-reset").addEventListener("click",resetUmkreis);

el("plz-input").addEventListener("keydown",function(e){
  if(e.key==="Enter") el("btn-umkreis-suche").click();
});

function updateRegionSelect(){
  const sel = el("bl-select");
  const wrap = el("bl-wrap");
  const list = [];
  if(activeLand === "alle"){
    const set={};
    Object.keys(BL_BY_LAND).forEach(l=>(BL_BY_LAND[l]||[]).forEach(b=>set[b]=1));
    Object.keys(set).sort((a,b)=>a.localeCompare(b,"de")).forEach(v=>list.push(v));
  } else {
    (BL_BY_LAND[activeLand]||[]).forEach(v=>list.push(v));
  }
  sel.innerHTML=`<option value="alle">Alle</option>`+list.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  wrap.classList.toggle("visible", list.length>0);
  if(activeBL!=="alle" && list.indexOf(activeBL)===-1) activeBL="alle";
  sel.value=activeBL;
}

function setEinrichtungTypVisibility(){
  el("typ2-wrap").classList.toggle("visible", activeTab==="Einrichtung");
  if(activeTab!=="Einrichtung"){ activeEinrTyp="alle"; el("typ2-select").value="alle"; }
}

function buildPopup(d){
  const baseLoc = `${esc(d.plz||"")} ${esc(d.ort||"")}`.trim();
  const bl = d.bundesland ? ` · ${esc(d.bundesland)}` : "";
  const ld = d.land ? ` · ${esc(d.land)}` : "";
  const meta = `<div class="popup-meta">${baseLoc}${bl}${ld}</div>`;

  let note = "";
  if(EINSTELLUNGEN.berufAnzeigen && d.typ==="Singleiter" && d.beruf) note=`<div class="popup-note">${esc(d.beruf)}</div>`;
  if(d.typ==="Einrichtung"){
    const t = d.einrichtung_typ ? `Typ: ${esc(d.einrichtung_typ)}` : "";
    const z = d.zertifizierung_datum ? `Zertifizierung: ${esc(d.zertifizierung_datum)}` : "";
    const parts=[t,z].filter(Boolean);
    if(parts.length) note=`<div class="popup-note">${parts.join(" · ")}</div>`;
  }

  const links=[];
  if(d.telefon) links.push(linkLine("tel:"+esc(d.telefon), phoneSvg(), esc(d.telefon)));
  if(d.email) links.push(linkLine("mailto:"+esc(d.email), mailSvg(), esc(d.email)));
  websiteEntries(d.webseite).forEach(entry => {
    links.push(linkLine(entry.url, `<span style="display:inline-block">${globeSvg()}</span>`, esc(entry.label)));
  });

  const typChip=`<span class="badge ${TYPE_CLS[d.typ]||"singleiter"}">${esc(d.typ==="Einrichtung"?"Einrichtung":(d.typ==="Singkreis"?"Singkreis":"Singleiter:in"))}</span>`;

  let headerFav="";
  if(EINSTELLUNGEN.logosAnzeigen && d.webseite){
    const fav=faviconFromUrl(firstWebsiteUrl(d.webseite));
    if(fav) headerFav=`<img class="popup-header-fav" src="${fav}" alt="" loading="lazy" onerror="this.onerror=null;this.src='';this.style.display='none';">`;
  }

  return `<div class="popup-inner">
    ${headerFav}
    <div class="popup-title">${typChip}<span>${esc(displayName(d))}</span></div>
    ${meta}
    ${note}
    <div class="popup-contacts">${links.join("")}</div>
  </div>`;
}

function linkLine(href,icon,text){
  const sh=esc(href), st=esc(text);
  const tgt=sh.startsWith("http")?' target="_blank" rel="noopener"':"";
  return `<a class="popup-link" href="${sh}"${tgt}>${icon}<span>${st}</span></a>`;
}
function mailSvg(){return`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>`;}
function phoneSvg(){return`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.1a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.34h3a2 2 0 0 1 2 1.72c.09.94.28 1.88.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.77-.77a2 2 0 0 1 2.11-.45c.93.42 1.87.61 2.81.7A2 2 0 0 1 21.73 17z"/></svg>`;}
function globeSvg(){return`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;}

// ------------------------------------------------------------
// Filter + Liste
// ------------------------------------------------------------
function applyFilter(){
  hideError();
  const q=el("search").value.toLowerCase().trim();
  filteredIdx=[];
  for(let i=0;i<DATA.length;i++){
    const d=DATA[i];
    if(activeTab!=="alle" && d.typ!==activeTab) continue;
    if(activeLand!=="alle" && d.land!==activeLand) continue;
    if(activeBL!=="alle" && (d.bundesland||"")!==activeBL) continue;
    if(activeTab==="Einrichtung" && activeEinrTyp!=="alle" && (d.einrichtung_typ||"")!==activeEinrTyp) continue;
    if(q){
      const hay=[d.typ,d.name,d.vorname,d.nachname,d.plz,d.ort,d.bundesland,d.land,d.beruf,d.einrichtung_typ,d.email,d.telefon,d.webseite].filter(Boolean).join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) continue;
    }
    if(umkreisCenter && umkreisKm && d.typ!=="Online"){
      const lat=parseFloat(d.lat), lng=parseFloat(d.lng);
      if(isNaN(lat)||isNaN(lng)) continue;
      if(haversineKm(umkreisCenter.lat,umkreisCenter.lng,lat,lng)>umkreisKm) continue;
    }
    filteredIdx.push(i);
  }
  for(let i=0;i<markers.length;i++){
    if(!markers[i]) continue;
    const show=filteredIdx.indexOf(i)!==-1;
    if(show){ if(!map.hasLayer(markers[i])) markers[i].addTo(map); }
    else{ if(map.hasLayer(markers[i])) map.removeLayer(markers[i]); }
  }
  renderList();
  el("list-count").textContent=`${filteredIdx.length} ${filteredIdx.length===1?"Treffer":"Treffer"}`;
  setHeaderCount(DATA.length);
  if(activeItemIndex!==null && filteredIdx.indexOf(activeItemIndex)===-1) setActive(null,false);
}

function renderList(){
  const list=el("list");
  if(filteredIdx.length===0){ list.innerHTML=`<div class="no-results">Keine Treffer. Wähle „Alle“ oder vergrößere den Umkreis.</div>`; return; }
  list.innerHTML=filteredIdx.map(idx=>{
    const d=DATA[idx];
    const cls=d.typ==="Online"?"online":(TYPE_CLS[d.typ]||"singleiter");
    const landCls=landBadgeClass(d.land);
    const badge=d.typ==="Online"
      ?`<span class="badge online">Online</span>`
      :`<span class="badge ${cls}">${d.typ==="Einrichtung"?"Einrichtung":(d.typ==="Singkreis"?"Singkreis":"Singleiter:in")}</span>`;
    const land=d.land?`<span class="land-badge">${esc(d.land)}</span>`:"";
    const loc=d.typ==="Online"?"Online-Angebot":`${esc(d.plz||"")} ${esc(d.ort||"")}`.trim();
    const bl=d.typ==="Online"?"":d.bundesland?` · ${esc(d.bundesland)}`:"";
    const sub=d.typ==="Online"
      ?(d.einrichtung_typ?esc(d.einrichtung_typ):(EINSTELLUNGEN.berufAnzeigen&&d.beruf?esc(d.beruf):""))
      :(EINSTELLUNGEN.berufAnzeigen&&d.typ==="Singleiter"&&d.beruf)?esc(d.beruf):(d.typ==="Einrichtung"&&d.einrichtung_typ)?`Typ: ${esc(d.einrichtung_typ)}`:"";
    const active=(activeItemIndex===idx)?" active":"";
    let onlineLinks = "";
    if(d.typ==="Online"){
      const parts=[];
      if(d.email) parts.push(`<a href="mailto:${esc(d.email)}" onclick="event.stopPropagation()">${esc(d.email)}</a>`);
      if(d.telefon) parts.push(`<span>${esc(d.telefon)}</span>`);
      websiteEntries(d.webseite).forEach(entry => {
        parts.push(`<a href="${esc(entry.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(entry.label || hostFromUrl(entry.url))}</a>`);
      });
      if(parts.length) onlineLinks=`<div class="item-sub" style="margin-top:4px">${parts.join("<br>")}</div>`;
    }
    return `<div class="list-item${active}" data-idx="${idx}">
      <div class="item-top">
        <div class="item-name">${esc(displayName(d))}</div>
        <div class="item-location">${badge}<span>${esc(loc)}${bl}</span>${land}</div>
        ${sub?`<div class="item-sub">${sub}</div>`:""}
        ${onlineLinks}
      </div>
    </div>`;
  }).join("");
  Array.from(list.querySelectorAll(".list-item")).forEach(elm=>{
    elm.addEventListener("click",()=>setActive(parseInt(elm.getAttribute("data-idx"),10),true));
  });
}

function setActive(idx, pan){
  if(activeItemIndex!==null && markers[activeItemIndex]) markers[activeItemIndex].setIcon(makeIcon(DATA[activeItemIndex],false));
  activeItemIndex=idx;
  Array.from(el("list").querySelectorAll(".list-item")).forEach(li=>li.classList.remove("active"));
  if(idx===null||idx===undefined) return;
  const d=DATA[idx], m=markers[idx];
  const li=el("list").querySelector(`.list-item[data-idx="${idx}"]`);
  if(li) li.classList.add("active");
  if(!m) return;
  m.setIcon(makeIcon(d,true));
  m.openPopup();
  if(pan) map.setView(m.getLatLng(),Math.max(map.getZoom(),8),{animate:true});
}

// ------------------------------------------------------------
// Initialisierung
// ------------------------------------------------------------
function initMap(rows){
  if(!Array.isArray(rows)){ showError("Datenformat ungültig."); el("loading").classList.add("hidden"); return; }
  DATA=rows.map(r=>{
    const d=Object.assign({},r);
    if(d.typ){
      d.typ=String(d.typ).trim();
      if(/^single/i.test(d.typ)) d.typ="Singleiter";
      else if(/^singk/i.test(d.typ)) d.typ="Singkreis";
      else if(/^einr/i.test(d.typ)) d.typ="Einrichtung";
      else if(/^online/i.test(d.typ)) d.typ="Online";
    }
    return d;
  }).filter(r=>r!=null);

  BL_BY_LAND={};
  DATA.forEach(d=>{
    if(!d.land||d.typ==="Online") return;
    if(!BL_BY_LAND[d.land]) BL_BY_LAND[d.land]={};
    if(d.bundesland) BL_BY_LAND[d.land][d.bundesland]=1;
  });
  Object.keys(BL_BY_LAND).forEach(l=>{
    BL_BY_LAND[l]=Object.keys(BL_BY_LAND[l]).sort((a,b)=>a.localeCompare(b,"de"));
  });

  // Gleiche Koordinaten: Einträge im kleinen Kreis (bis 8) bzw. in einer Spirale um den Ort verteilen
  const proOrt={};
  DATA.forEach(d=>{
    if(d.typ==="Online"||!d.lat||!d.lng) return;
    const key=parseFloat(d.lat).toFixed(5)+","+parseFloat(d.lng).toFixed(5);
    (proOrt[key]=proOrt[key]||[]).push(d);
  });
  Object.keys(proOrt).forEach(key=>{
    const g=proOrt[key]; if(g.length<2) return;
    g.forEach((d,k)=>{
      let r,w;
      if(g.length<=8){ r=Math.max(11,g.length*20/(2*Math.PI)); w=-Math.PI/2+k*2*Math.PI/g.length; }
      else { r=9*Math.sqrt(k+1); w=k*2.39996; }
      d._dx=Math.round(r*Math.cos(w)); d._dy=Math.round(r*Math.sin(w));
    });
  });

  markers=[];
  DATA.forEach((d,i)=>{
    if(d.typ==="Online"||!d.lat||!d.lng||isNaN(parseFloat(d.lat))||isNaN(parseFloat(d.lng))){
      markers.push(null);
      return;
    }
    const m=L.marker([parseFloat(d.lat),parseFloat(d.lng)],{icon:makeIcon(d,false)})
      .bindPopup(buildPopup(d),{maxWidth:330});
    m.on("click",()=>setActive(i,false));
    markers.push(m);
  });
  markers.forEach(m=>{ if(m) m.addTo(map); });
  if(JAHRESTAGUNG.anzeigen){
    const jt=JAHRESTAGUNG;
    const ic=L.divIcon({className:"punkt-wrap",
      html:`<div class="jt-marke"><span class="jt-punkt"></span><span class="jt-schild">${esc(jt.titel)}</span></div>`,
      iconSize:[1,1], iconAnchor:[0,0], popupAnchor:[0,-12]});
    L.marker([jt.lat,jt.lng],{icon:ic,zIndexOffset:1000,keyboard:true,title:jt.titel}).addTo(map)
      .bindPopup(`<div class="popup-inner"><div class="popup-title"><span class="badge jt">Jahrestagung</span><span>${esc(jt.thema)}</span></div>
        <div class="popup-meta">${esc(jt.datum)} · ${esc(jt.ort)}</div>
        <div class="popup-contacts"><a class="popup-link" href="${esc(jt.link)}" target="_blank" rel="noopener"><span>Programm und Anmeldung →</span></a></div></div>`,{maxWidth:300});
  }
  // Beim Start auf alle Punkte zoomen (statt fester Ausschnitt)
  const pts=markers.filter(Boolean).map(m=>m.getLatLng());
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[24,24],maxZoom:9});
  setHeaderCount(DATA.length);
  el("loading").classList.add("hidden");
  updateRegionSelect();
  setEinrichtungTypVisibility();
  applyFilter();
}

Array.from(document.querySelectorAll("#tabs .tab")).forEach(t=>{
  t.addEventListener("click",()=>{
     Array.from(document.querySelectorAll("#tabs .tab")).forEach(x=>x.classList.remove("active","singleiter","singkreis","einrichtung","online"));
    t.classList.add("active");
    setPressed("#tabs .tab",t);
    const cls=t.getAttribute("data-cls");
    if(cls) t.classList.add(cls);
    activeTab=t.getAttribute("data-tab")==="alle"?"alle":t.getAttribute("data-tab");
    setEinrichtungTypVisibility();
    applyFilter();
    zoomAufTreffer(true);
  });
});

Array.from(document.querySelectorAll("#land-btns .land-btn")).forEach(b=>{
  b.addEventListener("click",()=>{
    Array.from(document.querySelectorAll("#land-btns .land-btn")).forEach(x=>x.classList.remove("active-all","active-de","active-at","active-ch"));
    activeLand=b.getAttribute("data-land");
    b.classList.add(b.getAttribute("data-cls")||"active-all");
    setPressed("#land-btns .land-btn",b);
    activeBL="alle";
    updateRegionSelect();
    applyFilter();
    zoomAufTreffer(true);
  });
});

// Nach jeder Filter-Auswahl die Karte auf die Treffer zoomen; am Handy (Filter unter der Karte) zur Karte hochscrollen.
function zoomAufTreffer(scrollen){
  if(umkreisCircle) return; // Umkreissuche hat ihren eigenen Ausschnitt
  const pts=filteredIdx.map(i=>markers[i]).filter(Boolean).map(m=>m.getLatLng());
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:10,animate:true});
  if(scrollen && window.matchMedia("(max-width:780px)").matches){
    el("map").scrollIntoView({behavior:"smooth",block:"start"});
  }
}
el("bl-select").addEventListener("change",()=>{ activeBL=el("bl-select").value; applyFilter(); zoomAufTreffer(true); });
el("typ2-select").addEventListener("change",()=>{ activeEinrTyp=el("typ2-select").value; applyFilter(); zoomAufTreffer(true); });

let searchTimer=null;
el("search").addEventListener("input",()=>{
  if(searchTimer) clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ applyFilter(); if(el("search").value.trim().length>=3) zoomAufTreffer(false); },300);
});
